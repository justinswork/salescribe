# Firebase App Hosting configuration.
# See: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets are managed in Google Secret Manager. Create them with:
#   firebase apphosting:secrets:set ANTHROPIC_API_KEY
#   firebase apphosting:secrets:set OPENAI_API_KEY
#   firebase apphosting:secrets:set SALESCRIBE_SERVICE_TOKEN   # any long random string
# (The CLI prompts for the value and grants access to the App Hosting service account.)
#
# Auth enforcement: the /api/* routes verify a Firebase ID token (or the
# service token above) and rate-limit per user. Enforcement turns on
# automatically in this runtime because Cloud Run sets K_SERVICE — no flag
# needed. ID-token verification and the rate-limit store use the App Hosting
# runtime service account's Application Default Credentials (no key file).

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  # Cloud Run default request timeout (5 min) is plenty for our Whisper + Claude calls.

env:
  # Secrets — runtime-only, never logged, never bundled into the client.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  # Shared bearer token for server-to-server callers (the eval harness). Real
  # users authenticate with their Firebase ID token instead; this is the
  # non-interactive path. Runtime-only — never bundled into the client.
  - variable: SALESCRIBE_SERVICE_TOKEN
    secret: SALESCRIBE_SERVICE_TOKEN
    availability:
      - RUNTIME

  # Firebase Web SDK config. Public values by design (they ship to every
  # visitor's browser as part of the client bundle). NEXT_PUBLIC_* prefix
  # means Next.js inlines them into the client bundle at build time, so
  # availability must include BUILD.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA2GTt7OryaHOYx_-IOShaFQDfq-zOdeT4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: salescribe-2532a.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: salescribe-2532a
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: salescribe-2532a.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "632214597362"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:632214597362:web:7c85e45c95ff3c20bf2a6b
    availability:
      - BUILD
      - RUNTIME
